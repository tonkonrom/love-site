<!DOCTYPE html>
<html>

<head>
<title>Для тебя ❤️</title>

<style>

body{
background:#ffb6c1;
font-family:Arial;
text-align:center;
margin-top:120px;
}

button{
font-size:60px;
padding:20px;
border:none;
background:none;
cursor:pointer;
}

#message{
font-size:30px;
margin-top:40px;
color:#800000;
}

</style>

</head>

<body>

<h1>У меня для тебя кое-что есть ❤️</h1>

<button onclick="showMessage()">🍑</button>

<div id="message"></div>

<script>

let text = "С 8 марта ❤️";   // потом поменяем на твой текст
let i = 0;

function showMessage(){

let speed = 50;

function typeWriter(){
if (i < text.length){
document.getElementById("message").innerHTML += text.charAt(i);
i++;
setTimeout(typeWriter, speed);
}
}

typeWriter();

}

</script>

</body>

</html>
