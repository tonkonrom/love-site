<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Для тебя ❤️</title>
<style>
body {
  margin: 0;
  height: 100vh;
  overflow: hidden;
  background-color: #800000;
  font-family: Arial, sans-serif;
  position: relative;
}

/* --- Эмодзи общий стиль --- */
.particle {
  position: absolute;
  pointer-events: none;
  user-select: none;
  z-index: 1;
  opacity: 1;
}

/* --- Слайд 1 --- */
#slide1 {
  display: flex;
  justify-content: center;
  align-items: center;
  width: 100%;
  height: 100%;
  position: relative;
}

#envelope {
  width: 300px;
  height: 200px;
  background: #fff;
  border-radius: 10px;
  display: flex;
  justify-content: center;
  align-items: center;
  cursor: pointer;
  box-shadow: 0 8px 20px rgba(0,0,0,0.3);
  z-index: 5;
  position: relative;
}

#peach1 {
  font-size:60px;
  z-index:6;
}

.flower {
  position: absolute;
  font-size:25px;
  color:pink;
  z-index:6;
}

/* --- Слайд 2 --- */
#slide2 {
  display:none;
  flex-direction: column;
  align-items: center;
  text-align: center;
  width:100%;
  height:100%;
  position: relative;
}

#slide2 h2 {
  color:#fff;
  font-size:28px;
  margin-bottom:20px;
  z-index:5;
  margin-top:80px; /* чуть ниже центра */
}

#options {
  display:flex;
  gap:50px;
  z-index:5;
  margin-top:20px; /* чуть ниже */
}

.option {
  background:#fff;
  color:#000;
  border-radius:20px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-weight:bold;
  font-size:22px;
  cursor:pointer;
  transition:all 0.3s;
  text-align:center;
  position: relative;
  width:400px;
  height:400px;
  overflow:hidden;
}

.option .emoji {
  position:absolute;
  top:10px;
  font-size:35px;
  z-index:1;
}

/* --- Слайд 3 --- */
#slide3 {
  display:none;
  width:100%;
  height:100%;
  position: relative;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

#finalText {
  position:absolute;
  z-index:5;
  color:#fff;
  font-size:40px;
  text-align:center;
  width:100%;
}

/* --- Белые сердца --- */
.heart {
  position: absolute;
  color:#fff;
  font-size:25px;
  text-shadow:0 0 10px #fff;
  z-index:2;
}
</style>
</head>
<body>

<!-- Слайд 1 -->
<div id="slide1">
  <div id="envelope">
    <div id="peach1">🍑</div>
  </div>
</div>

<!-- Слайд 2 -->
<div id="slide2">
  <h2>Любимая, выбор за тобой 😉🫦</h2>
  <div id="options">
    <div id="efremov" class="option">
      Ромочка, дорогой, самый любимый, прекрасный и хороший
      <div class="emoji" id="hearts"></div>
    </div>
    <div id="vampire" class="option">
      жалкий вампир Деймон
      <div class="emoji" id="dislike"></div>
    </div>
  </div>
</div>

<!-- Слайд 3 -->
<div id="slide3">
  <div id="finalText">С 8 Марта тебя, любовь моя ❤️</div>
</div>

<script>
const slide1=document.getElementById('slide1');
const slide2=document.getElementById('slide2');
const slide3=document.getElementById('slide3');
const envelope=document.getElementById('envelope');
const efremov=document.getElementById('efremov');
const vampire=document.getElementById('vampire');
const hearts=document.getElementById('hearts');
const dislike=document.getElementById('dislike');
const finalText=document.getElementById('finalText');

let efremovSize=400;
let vampireSize=400;
const minVampire=20;
const maxEfremov=window.innerWidth;
const step=(vampireSize-minVampire)/16;

// --- Слайд 1: цветы ---
for(let i=0;i<5;i++){
  const f=document.createElement('div');
  f.classList.add('flower');
  f.style.left=(140+Math.random()*20)+'px';
  f.style.top=(Math.random()*80)+'px';
  f.textContent='🌸';
  slide1.appendChild(f);
}

// --- Функция создания эмодзи ---
function createParticles(parent,count,symbols,minSize,maxSize){
  for(let i=0;i<count;i++){
    const p=document.createElement('div');
    p.classList.add('particle');
    p.textContent=symbols[Math.floor(Math.random()*symbols.length)];
    p.style.left=Math.random()*window.innerWidth+'px';
    p.style.bottom=-50+'px'; // старт снизу
    p.style.fontSize=(minSize+Math.random()*(maxSize-minSize))+'px';
    parent.appendChild(p);
  }
}

// --- Анимация эмодзи ---
function animateParticles(){
  const particles=document.querySelectorAll('.particle');
  particles.forEach(p=>{
    let bottom=parseFloat(p.style.bottom);
    bottom+=1+Math.random()*2; // скорость
    if(bottom>window.innerHeight+50){
      bottom=-50; // снова снизу
      p.style.left=Math.random()*window.innerWidth+'px';
    }
    p.style.bottom=bottom+'px';
  });
  requestAnimationFrame(animateParticles);
}

// --- Слайд 1 ---
createParticles(slide1,50,['✨','🌼','🦋','🌸'],15,30);
animateParticles();

// --- Клик по конверту ---
envelope.addEventListener('click',()=>{
  slide1.style.display='none';
  slide2.style.display='flex';
  createParticles(slide2,50,['✨','🌼','🦋','🌸'],15,30); // эмодзи на 2 слайде
});

// --- Слайд 2 ---
efremov.addEventListener('click',()=>{
  hearts.textContent+='❤️';
  slide2.style.display='none';
  slide3.style.display='flex';

  // белые сердца на 3 слайде
  setInterval(()=>{
    const heart=document.createElement('div');
    heart.classList.add('heart');
    heart.style.left=Math.random()*window.innerWidth+'px';
    heart.style.fontSize=(15+Math.random()*15)+'px';
    heart.style.bottom='-30px';
    slide3.appendChild(heart);

    // анимация движения вверх
    let b= -30;
    function rise(){
      b+=1+Math.random();
      if(b>window.innerHeight+50){
        heart.remove();
        return;
      }
      heart.style.bottom=b+'px';
      requestAnimationFrame(rise);
    }
    rise();
  },200);
});

vampire.addEventListener('click',()=>{
  vampireSize=Math.max(minVampire,vampireSize-step);
  efremovSize=Math.min(maxEfremov,efremovSize+step);
  vampire.style.width=vampire.style.height=vampireSize+'px';
  efremov.style.width=efremov.style.height=efremovSize+'px';
  dislike.textContent+='👎';
});
</script>
</body>
</html>
